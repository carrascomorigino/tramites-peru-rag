name: Live check of official sources
on:
  schedule:
    - cron: '0 13 * * 1' # every Monday, 08:00 Lima
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    # A missed page shows as a warning on the run. Gino reads it and refreshes the snapshot.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-live
